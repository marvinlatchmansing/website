<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <meta charset="UTF-8">
    <title>Contact</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/contact.css">
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="logo">Portfolio</div>

        <div class="nav">
            <a href="index.html">Home</a>
            <a href="work.html">My Work</a>
            <a href="documents.html">Documents</a>
            <a href="contact.html">Contact</a>
        </div>
    </div>
    
    <div class="background-glow glow1"></div>
    <div class="background-glow glow2"></div>
    
    <!-- Contact Section -->
<div class="contact-container">

    <!-- Left Side: Info -->
    <div class="contact-info">
        <h2>Let’s Connect</h2>
        <p>
            Feel free to reach out for collaborations, projects, or just a chat about tech.
            I usually respond within 24–48 hours.
        </p>

        <div class="info-box">
            <i class="fa-solid fa-envelope"></i>
            <span>latchshar@gmail.com</span>
        </div>

        <div class="info-box">
            <i class="fa-solid fa-phone"></i>
            <span>+597 7273468</span>
        </div>

        <div class="info-box">
            <i class="fa-solid fa-location-dot"></i>
            <span>Paramaribo, Suriname</span>
        </div>

        <div class="socials">
            <a href="#"><i class="fa-brands fa-github"></i></a>
            <a href="#"><i class="fa-brands fa-linkedin"></i></a>
            <a href="#"><i class="fa-brands fa-facebook"></i></a>
        </div>
    </div>

    <!-- Right Side: Form -->
    <div class="contact-form">
        <h2>Send a Message</h2>

        <form>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <input type="text" placeholder="Subject">
            <textarea placeholder="Your Message" rows="6" required></textarea>

            <button type="submit">Send Message</button>
        </form>
    </div>

</div>

</body>
</html>
